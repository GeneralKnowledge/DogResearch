name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  kb-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:kb
      - uses: actions/upload-artifact@v4
        with:
          name: good-dog-kb-dist
          path: |
            dist/good-dog-domain.json
            dist/good-dog-safety.json
            dist/good-dog-guides.json
            dist/good-dog-referrals.json
            dist/good-dog-ask-patterns.json
      - name: URL health (non-blocking)
        run: npm run url-check
        continue-on-error: true

  kindtrail-web:
    runs-on: ubuntu-latest
    needs: kb-export
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'kindtrail-preview')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run export && npm run build -w @gooddog/web
