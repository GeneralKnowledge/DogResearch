name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  kb-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: URL health (non-blocking)
        run: npm run url-check
        continue-on-error: true
